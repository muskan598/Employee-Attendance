openapi: 3.0.3
info:
  title: Employee Attendance & Analytics API
  description: |
    FastAPI + MongoDB attendance system with business rules R1-R10 and analytics.
    
    ## Business Rules
    
    **R1. Time zone and attendance date**
    - IST (UTC+05:30) is used for all shift times and attendance dates
    - A record's date is the IST calendar date of its punch_in
    - Overnight shifts (shift_end <= shift_start): punch-in earlier than shift_end belongs to previous day's shift
    - Instants truncated to whole seconds before calculation
    
    **R2. Late calculation**
    - Grace period: 10 minutes
    - Late only if punch-in strictly > 10:00 after shift_start
    - late_minutes = whole minutes (floor) from shift_start (not from grace period end)
    - Example: shift 09:30, punch 09:40:00 = 0 late; 09:40:01 = 10 late; 10:15:59 = 45 late
    
    **R3. Overtime calculation**
    - Whole minutes (floor) from shift_end to punch_out
    - Counted only if >= 30 minutes; otherwise 0
    
    **R4. Work hours calculation**
    - (punch_out - punch_in) in seconds / 3600
    - Rounded to 2 decimals half-up
    - null until punch-out
    
    **R5. Half day determination**
    - After punch-out, half_day = true when work_hours < 4.50
    - Half day counts as 0.5 present days
    
    **R6. Presence statuses**
    - PRESENT, WFH, ON_DUTY count as present
    - ABSENT, LEAVE do not count as present
    
    **R7. Working days**
    - Monday - Friday only (no holiday calendar)
    - Counted from joined_on for mid-month joiners
    - present_days counts only Mon-Fri records
    - Weekend records still add to late and overtime totals
    
    **R8. Number formatting**
    - 2 decimals half-up for most numbers
    - 4 decimals half-up for rates/percentages
    
    **R9. Headcount**
    - Employees with joined_on on or before end of period
    - Includes employees with zero attendance logs
    
    **R10. Pagination**
    - page starts at 1
    - page_size default 20, max 100
    - total always reflects the filters applied
    
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Returns 200 if MongoDB is reachable, 503 otherwise
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employees:
    post:
      summary: Create employee
      description: Creates a new employee record. Returns 409 if emp_code already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '409':
          description: Employee already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      summary: List employees
      description: List employees with optional department filter and pagination
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /attendance/punch-in:
    post:
      summary: Punch in
      description: |
        Creates attendance record for the day (R1, R2, R6).
        Race-safe: returns 409 if record already exists for that (emp_code, date).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchInRequest'
      responses:
        '201':
          description: Punched in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Attendance record already exists for this date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/punch-out:
    post:
      summary: Punch out
      description: |
        Updates attendance record with work hours, overtime, half_day (R3, R4, R5).
        Race-safe: uses atomic update with condition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchOutRequest'
      responses:
        '200':
          description: Punched out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '404':
          description: No open attendance record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already punched out or concurrent update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance:
    get:
      summary: List attendance records
      description: Filter by employee, dates, status with pagination
      parameters:
        - name: emp_code
          in: query
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AttendanceStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttendanceRecord'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /attendance/{emp_code}/{date}:
    patch:
      summary: Regularize attendance
      description: |
        Manual correction of attendance record. Recomputes all derived fields and appends to history.
        Race-safe for concurrent regularizations.
      parameters:
        - name: emp_code
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegularizationRequest'
      responses:
        '200':
          description: Record regularized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '404':
          description: Employee or record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/employees/{emp_code}/monthly:
    get:
      summary: Employee monthly summary
      description: Monthly attendance summary for one employee (R6, R7, R8)
      parameters:
        - name: emp_code
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-07'
      responses:
        '200':
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMonthlySummary'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/departments/summary:
    get:
      summary: Department summary
      description: |
        Department-wise summary for a month (R6, R7, R8, R9).
        Headcount includes employees with zero logs.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-07'
      responses:
        '200':
          description: Department summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                  departments:
                    type: array
                    items:
                      $ref: '#/components/schemas/DepartmentSummary'

  /analytics/leaderboard/late:
    get:
      summary: Late-comers leaderboard
      description: |
        Ranking with proper tie handling (R2, R7, R8).
        Ties share rank, next rank is skipped (1, 2, 2, 4).
        Limit applied after ranking. Tied rows ordered by emp_code.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Late leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                  leaderboard:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'

  /analytics/departments/{department}/trend:
    get:
      summary: Department daily trend
      description: |
        Daily attendance series with 7-day moving average (R6, R8).
        One row per calendar day (including weekends/gaps).
        Moving average over preceding window (shorter for first days).
      parameters:
        - name: department
          in: path
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Daily trend with moving average
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTrend'

  /admin/explain/{endpoint}:
    get:
      summary: MongoDB explain output
      description: |
        Returns MongoDB explain with executionStats for endpoint's main query.
        Proves queries use indexes (IXSCAN, no COLLSCAN).
        
        Valid endpoints: attendance_list, employee_monthly, department_summary, late_leaderboard, department_trend
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
            enum:
              - attendance_list
              - employee_monthly
              - department_summary
              - late_leaderboard
              - department_trend
        - name: emp_code
          in: query
          required: false
          schema:
            type: string
        - name: month
          in: query
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: MongoDB explain output
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    AttendanceStatus:
      type: string
      enum:
        - PRESENT
        - WFH
        - ON_DUTY
        - ABSENT
        - LEAVE
    
    EmployeeCreate:
      type: object
      required:
        - emp_code
        - name
        - email
        - department
        - shift_start
        - shift_end
        - joined_on
      properties:
        emp_code:
          type: string
          example: EMP0001
        name:
          type: string
          example: Asha Rao
        email:
          type: string
          format: email
          example: asha@example.com
        department:
          type: string
          example: Engineering
        shift_start:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '09:30'
        shift_end:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '18:30'
        joined_on:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-01-05'
    
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeCreate'
        - type: object
          properties:
            created_at:
              type: integer
              format: int64
              description: Epoch milliseconds
              example: 1704423000000
    
    PunchInRequest:
      type: object
      required:
        - emp_code
        - punched_at
        - status
      properties:
        emp_code:
          type: string
          example: EMP0001
        punched_at:
          type: integer
          format: int64
          description: Epoch milliseconds
          example: 1720242480000
        status:
          type: string
          enum:
            - PRESENT
            - WFH
            - ON_DUTY
    
    PunchOutRequest:
      type: object
      required:
        - emp_code
        - punched_at
      properties:
        emp_code:
          type: string
          example: EMP0001
        punched_at:
          type: integer
          format: int64
          description: Epoch milliseconds
          example: 1720275300000
    
    RegularizationRequest:
      type: object
      required:
        - by
        - reason
      properties:
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        punch_in:
          type: integer
          format: int64
          description: Epoch milliseconds
          nullable: true
        punch_out:
          type: integer
          format: int64
          description: Epoch milliseconds
          nullable: true
        by:
          type: string
          example: hr.admin
        reason:
          type: string
          example: biometric glitch
    
    AttendanceRecord:
      type: object
      properties:
        emp_code:
          type: string
          example: EMP0001
        date:
          type: string
          format: date
          example: '2026-07-06'
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        punch_in:
          type: integer
          format: int64
          description: Epoch milliseconds
          nullable: true
        punch_out:
          type: integer
          format: int64
          description: Epoch milliseconds
          nullable: true
        work_hours:
          type: number
          format: double
          nullable: true
          example: 9.12
        late_minutes:
          type: integer
          example: 0
        overtime_minutes:
          type: integer
          example: 0
        half_day:
          type: boolean
          example: false
    
    EmployeeMonthlySummary:
      type: object
      properties:
        emp_code:
          type: string
        month:
          type: string
          example: '2026-07'
        working_days:
          type: integer
        present_days:
          type: number
          format: double
        total_late_minutes:
          type: integer
        total_overtime_minutes:
          type: integer
        total_work_hours:
          type: number
          format: double
        attendance_rate:
          type: number
          format: double
          description: Percentage with 4 decimals
    
    DepartmentSummary:
      type: object
      properties:
        department:
          type: string
        headcount:
          type: integer
        total_present_days:
          type: number
          format: double
        total_late_minutes:
          type: integer
        total_overtime_minutes:
          type: integer
        total_work_hours:
          type: number
          format: double
    
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        emp_code:
          type: string
        name:
          type: string
        department:
          type: string
        total_late_minutes:
          type: integer
    
    DepartmentTrend:
      type: object
      properties:
        department:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              present_count:
                type: number
                format: double
              avg_7day:
                type: number
                format: double
    
    Error:
      type: object
      properties:
        detail:
          type: string
